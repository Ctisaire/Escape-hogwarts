<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Búsqueda de los Horrocruxes ⚡</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Cinzel',serif;

background:#050505;

color:#f3d180;

overflow-x:hidden;

min-height:100vh;
}

.fondo{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background-size:cover;
background-position:center;

filter:
blur(8px)
brightness(0.25);

z-index:-2;
}

.fondo::after{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(0,0,0,0.55);
}

.magic{

position:fixed;

width:4px;
height:4px;

background:gold;

border-radius:100%;

opacity:.8;

z-index:-1;

animation:flotar linear infinite;
}

@keyframes flotar{

0%{

transform:
translateY(110vh);

opacity:0;
}

10%{
opacity:1;
}

90%{
opacity:1;
}

100%{

transform:
translateY(-100px);

opacity:0;
}

}

.contenedor{

width:95%;

max-width:950px;

margin:20px auto;

padding:30px;

background:
rgba(15,15,15,0.85);

border:2px solid #d4af37;

border-radius:12px;

box-shadow:
0 0 25px rgba(212,175,55,.25);

backdrop-filter:blur(4px);

animation:entrada 1s ease;
}

@keyframes entrada{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

width:140px;

display:block;

margin:auto;
}

h1{

margin-top:15px;

text-align:center;

font-size:clamp(30px,5vw,52px);

color:#d4af37;

text-shadow:
0 0 10px gold;
}

.intro{

margin-top:20px;

text-align:center;

font-size:18px;

line-height:1.6;
}

h2{

margin-top:25px;

text-align:center;

color:#ffd700;

font-size:32px;
}

#pregunta{

text-align:center;

margin:25px 0;

font-size:24px;

line-height:1.5;
}

.opcion{

width:100%;

padding:18px;

margin-top:12px;

background:
rgba(255,255,255,.08);

border:1px solid #876514;

color:white;

font-size:18px;

border-radius:8px;

cursor:pointer;

transition:.3s;
}

.opcion:hover{

background:
rgba(255,255,255,.15);

transform:scale(1.01);
}

.correcta{

background:#1d7429 !important;

border:2px solid gold !important;

animation:brillo 1s infinite;
}

@keyframes brillo{

0%{
box-shadow:0 0 8px gold;
}

50%{
box-shadow:0 0 30px gold;
}

100%{
box-shadow:0 0 8px gold;
}

}

.incorrecta{

background:#8d1f1f !important;
}

#resultado{

margin-top:25px;

text-align:center;

font-size:22px;

font-weight:bold;
}

.boton-musica{

display:block;

margin:20px auto;

background:#d4af37;

border:none;

padding:12px 20px;

border-radius:8px;

font-weight:bold;

cursor:pointer;
}

.footer{

margin-top:30px;

text-align:center;

opacity:.8;
}

</style>

</head>

<body>

<div id="bg" class="fondo"></div>

<audio id="music" loop>
  <source src="./music.mp3" type="audio/mpeg">
</audio>

<button class="boton-musica" onclick="toggleMusic()">
🎵 Activar / Desactivar Música
</button>

<div class="contenedor">

<img src="hogwarts.png" class="logo">

<h1>⚡ Búsqueda de los Horrocruxes ⚡</h1>

<p class="intro">
El Ministerio de Magia necesita tu ayuda.
Resuelve los enigmas y encuentra el siguiente rastro antes de que las fuerzas oscuras lo hagan.
</p>

<h2 id="localizacion"></h2>

<p id="pregunta"></p>

<div id="respuestas"></div>

<div id="resultado"></div>

<div class="footer">
🏰 Hogwarts School of Witchcraft and Wizardry 🏰
</div>

</div>

<script>

for(let i=0;i<50;i++){

const p=document.createElement("div");

p.className="magic";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(8+Math.random()*15)+"s";

p.style.animationDelay=Math.random()*8+"s";

document.body.appendChild(p);

}

const preguntas={

1:{
img:"loc1.jpg",
localizacion:"📍 Harry Walker",
pregunta:"¿Qué forma tiene el Patronus de Harry?",
correcta:"A",
respuestas:{
A:"Ciervo",
B:"Lobo",
C:"Águila",
D:"Zorro"
}
},

2:{
img:"loc2.jpg",
localizacion:"📍 Zona Verde",
pregunta:"¿Qué forma adopta el Patronus de Luna Lovegood?",
correcta:"D",
respuestas:{
A:"Cisne",
B:"Cierva",
C:"Gato",
D:"Liebre"
}
},

3:{
img:"loc3.jpg",
localizacion:"📍 Nou Pins",
pregunta:"¿Cómo se llama el centauro que ayuda a Harry en el Bosque Prohibido?",
correcta:"C",
respuestas:{
A:"Bane",
B:"Ronan",
C:"Firenze",
D:"Magorian"
}
},

4:{
img:"loc4.jpg",
localizacion:"📍 Metro Via Júlia",
pregunta:"¿Cuál es el nombre de la madre de Sirius Black?",
correcta:"C",
respuestas:{
A:"Bellatrix Black",
B:"Druella Black",
C:"Walburga Black",
D:"Andromeda Black"
}
},

5:{
img:"loc5.jpg",
localizacion:"📍 Fuentes Via Júlia",
pregunta:"¿Quién le da a Harry las branquialgas para realizar la segunda prueba del Torneo de los Tres Magos?",
correcta:"A",
respuestas:{
A:"Dobby",
B:"Neville",
C:"Ron",
D:"Hermione"
}
},

6:{
img:"loc6.jpg",
localizacion:"📍 Ángel Pestaña",
pregunta:"¿Cuál es el nombre completo de Albus Dumbledore?",
correcta:"B",
respuestas:{
A:"Albus Percival Walfred Brian Dumbledore",
B:"Albus Percival Wulfric Brian Dumbledore",
C:"Albus Percival Wilfred Brian Dumbledore",
D:"Albus Percival Wulfric Brayan Dumbledore"
}
}

};

const pista=new URLSearchParams(window.location.search).get("pista")||"1";

const datos=preguntas[pista];

document.getElementById("bg").style.backgroundImage=
`url('${datos.img}')`;

document.getElementById("localizacion").textContent=
datos.localizacion;

document.getElementById("pregunta").textContent=
datos.pregunta;

let intentos=0;

for(const letra in datos.respuestas){

const b=document.createElement("button");

b.className="opcion";

b.id=letra;

b.innerHTML=
`<strong>${letra})</strong> ${datos.respuestas[letra]}`;

b.onclick=()=>comprobar(letra);

document.getElementById("respuestas").appendChild(b);
}

function comprobar(letra){

if(letra===datos.correcta){

document.getElementById(letra)
.classList.add("correcta");

document.getElementById("resultado")
.innerHTML=
"✅ ¡Correcto! Continúa hacia la siguiente pista.";

desactivar();

return;
}

intentos++;

document.getElementById(letra)
.classList.add("incorrecta");

if(intentos>=2){

document.getElementById(datos.correcta)
.classList.add("correcta");

document.getElementById("resultado")
.innerHTML=
"❌ Has agotado tus intentos.";

desactivar();

}else{

document.getElementById("resultado")
.innerHTML=
"❌ Incorrecto. Te queda un intento.";
}
}

function desactivar(){

document.querySelectorAll(".opcion")
.forEach(x=>x.disabled=true);

}

const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

function toggleMusic(){

    if(music.paused){

        music.play()
        .then(() => {
            musicBtn.innerHTML = "🔇 Silenciar Magia";
        })
        .catch(err => {
            console.log(err);
        });

    }else{

        music.pause();
        musicBtn.innerHTML = "🎵 Activar Magia";
    }
}

function iniciarMusica(){

    music.play()
    .then(() => {
        musicBtn.innerHTML = "🔇 Silenciar Magia";
    })
    .catch(() => {});
}

document.addEventListener("touchstart", iniciarMusica, {once:true});
document.addEventListener("click", iniciarMusica, {once:true});

</script>

</body>
</html>
