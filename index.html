<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape Hogwarts</title>

<style>

body{
    margin:0;
    padding:20px;
    min-height:100vh;

    background:#c8a46b;
    background-image:
    linear-gradient(rgba(255,255,255,0.15),rgba(255,255,255,0.15)),
    url("https://www.transparenttextures.com/patterns/old-paper.png");

    font-family:Georgia, serif;
    color:#33210f;
}

.contenedor{

    max-width:850px;
    margin:auto;

    background:#f2dfb1;

    border:6px solid #8a6a33;
    border-radius:12px;

    padding:35px;

    box-shadow:
    0 0 30px rgba(0,0,0,0.3);
}

.logo{
    display:block;
    margin:auto;
    width:140px;
}

h1{

    text-align:center;
    color:#5a3d12;

    font-size:40px;

    margin-top:15px;

    text-shadow:
    1px 1px 2px #fff;
}

h2{
    text-align:center;
    color:#7a4f18;
}

#pregunta{
    font-size:22px;
    text-align:center;
    margin:30px 0;
}

.opcion{

    display:block;

    width:100%;

    padding:18px;

    margin:12px 0;

    border-radius:8px;

    border:2px solid #8a6a33;

    background:#ead3a2;

    color:#33210f;

    font-size:18px;

    text-align:left;

    cursor:pointer;

    transition:0.3s;
}

.opcion:hover{

    background:#e4c68a;
}

.correcta{

    background:#3d8b40 !important;
    color:white !important;
    border-color:#2f6b31 !important;
}

.incorrecta{

    background:#9e3232 !important;
    color:white !important;
    border-color:#6d1111 !important;
}

#resultado{

    margin-top:25px;

    padding:15px;

    border-radius:8px;

    text-align:center;

    font-size:20px;

    font-weight:bold;
}
</style>

</head>

<body>

<div class="contenedor">

<img src=hogwarts.png" class="logo">

<h1>
⚡ Búsqueda de los Horrocruxes ⚡
</h1>

<p style="text-align:center;">
Resuelve el enigma para continuar tu aventura.
</p>

<h2 id="localizacion"></h2>

<p id="pregunta"></p>

<div id="respuestas"></div>

<div id="resultado"></div>

</div>

<script>

const preguntas = {

1:{
localizacion:"Harry Walker",
pregunta:"¿Qué forma tiene el Patronus de Harry?",
correcta:"A",
respuestas:{
A:"Ciervo",
B:"Lobo",
C:"Águila",
D:"Zorro"
}
},

2:{
localizacion:"Zona Verde",
pregunta:"¿Qué forma adopta el Patronus de Luna Lovegood?",
correcta:"D",
respuestas:{
A:"Cisne",
B:"Cierva",
C:"Gato",
D:"Liebre"
}
}
,

3:{
localizacion:"Nou Pins",
pregunta:"¿Cómo se llama el centauro que ayuda a Harry en el Bosque Prohibido?",
correcta:"C",
respuestas:{
A:"Bane",
B:"Ronan",
C:"Firenze",
D:"Magorian"
}
}
,

4:{
localizacion:"Metro Via Júlia",
pregunta:"¿Cuál es el nombre de la madre de Sirius Black?",
correcta:"C",
respuestas:{
A:"Bellatrix Black",
B:"Druella Black",
C:"Walburga Black",
D:"Andromeda Black"
}
}
,

5:{
localizacion:"Fuentes Via Júlia",
pregunta:"¿Quién le da a Harry las branquialgas para realizar la segunda prueba del Torneo de los Tres Magos?",
correcta:"A",
respuestas:{
A:"Dobby",
B:"Neville",
C:"Ron",
D:"Hermione"
}
}
,

6:{
localizacion:"Angel Pestaña",
pregunta:"¿Cuál es el nombre completo de Albus Dumbledore?",
correcta:"B",
respuestas:{
A:"Albus Percival Walfred Brian Dumbledore",
B:"Albus Percival Wulfric Brian Dumbledore",
C:"Albus Percival Wilfred Brian Dumbledore",
D:"Albus Percival Wulfric Brayan Dumbledore"
}
}

};

const url = new URLSearchParams(window.location.search);
const pista = url.get("pista") || "1";

const datos = preguntas[pista];

document.getElementById("localizacion").innerText =
"📍 " + datos.localizacion;

document.getElementById("pregunta").innerText =
datos.pregunta;

let intentos=0;

for(const letra in datos.respuestas){

const boton = document.createElement("button");

boton.className="opcion";

boton.id=letra;

boton.innerHTML=
"<strong>"+letra+")</strong> "+datos.respuestas[letra];

boton.onclick=()=>comprobar(letra);

document.getElementById("respuestas").appendChild(boton);

}

function comprobar(letra){

if(letra===datos.correcta){

document.getElementById(letra)
.classList.add("correcta");

document.getElementById("resultado")
.innerHTML="✅ Correcto. Has conseguido la pista.";

desactivar();

return;
}

intentos++;

document.getElementById(letra)
.classList.add("incorrecta");

if(intentos>=2){

document.getElementById(datos.correcta)
.classList.add("correcta");

document.getElementById("resultado")
.innerHTML="❌ Sin intentos. La respuesta correcta era: "
+datos.respuestas[datos.correcta];

desactivar();

}else{

document.getElementById("resultado")
.innerHTML="❌ Incorrecto. Te queda 1 intento.";

}

}

function desactivar(){

document.querySelectorAll(".opcion")
.forEach(b=>b.disabled=true);

}

</script>

</body>
</html>
