<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Búsqueda de los Horrocruxes ⚡</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheeter-box;
}

body{

margin:0;
padding:20px;

font-family:'Cinzel',serif;

background:
radial-gradient(circle at center,#1a1a1a,#070707);

color:#f1d38b;

overflow-x:hidden;

min-height:100vh;
}

.magic{
position:fixed;
width:4px;
height:4px;
border-radius:50%;
background:gold;
animation:float 10s linear infinite;
opacity:0.7;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

10%{
opacity:1;
}

90%{
opacity:1;
}

100%{
transform:translateY(-100px);
opacity:0;
}
}

.contenedor{

max-width:1000px;

margin:auto;

background:
rgba(20,20,20,0.92);

border:3px solid #b8860b;

padding:35px;

box-shadow:
0 0 30px rgba(255,215,0,0.2);

animation:entrada 1s;
}

@keyframes entrada{

from{

opacity:0;
transform:scale(0.9);

}

to{

opacity:1;
transform:scale(1);

}

}

.logo{

display:block;

margin:auto;

width:220px;
}

h1{

text-align:center;

color:#d4af37;

font-size:48px;

text-shadow:
0 0 15px gold;
}

.intro{

text-align:center;

margin-bottom:25px;

font-size:18px;
}

.localizacionimg{

width:100%;

max-height:350px;

object-fit:cover;

border:2px solid #d4af37;

margin-top:15px;
margin-bottom:25px;
}

h2{

text-align:center;

color:#ffd700;
}

#pregunta{

font-size:24px;

text-align:center;

margin:30px 0;
}

.opcion{

width:100%;

padding:18px;

margin-top:10px;

background:#2b2b2b;

border:1px solid #555;

color:white;

font-size:18px;

cursor:pointer;

transition:0.3s;
}

.opcion:hover{

background:#3a3a3a;
}

.correcta{

background:#1f7a1f !important;

animation:brillo 1s infinite;
}

@keyframes brillo{

0%{box-shadow:0 0 10px gold;}
50%{box-shadow:0 0 30px gold;}
100%{box-shadow:0 0 10px gold;}

}

.incorrecta{

background:#8b1e1e !important;
}

#resultado{

margin-top:20px;

font-size:22px;

font-weight:bold;

text-align:center;
}

#musicBtn{

display:block;

margin:20px auto;

padding:12px 20px;

background:#d4af37;

border:none;

font-size:16px;

cursor:pointer;
}

</style>

</head>

<body>

<audio id="music" loop>
3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">
🎵 Activar / Desactivar Música
</button>

<div class="contenedor">

<img src="hogwarts.png" class="logo">

<h1>⚡ Búsqueda de los Horrocruxes ⚡</h1>

<p class="intro">
El Ministerio de Magia necesita tu ayuda.
Resuelve los enigmas para encontrar el siguiente rastro.
</p>

<div id="imagen"></div>

<h2 id="localizacion"></h2>

<p id="pregunta"></p>

<div id="respuestas"></div>

<div id="resultado"></div>

</div>

<script>

for(let i=0;i<35;i++){

let s=document.createElement('div');

s.className='magic';

s.style.left=Math.random()*100+'vw';

s.style.animationDelay=Math.random()*10+'s';

s.style.animationDuration=(8+Math.random()*10)+'s';

document.body.appendChild(s);

}

const preguntas={

1:{img:'loc1.jpg',localizacion:'Harry Walker',pregunta:'¿Qué forma tiene el Patronus de Harry?',correcta:'A',respuestas:{A:'Ciervo',B:'Lobo',C:'Águila',D:'Zorro'}},

2:{img:'loc2.jpg',localizacion:'Zona Verde',pregunta:'¿Qué forma adopta el Patronus de Luna Lovegood?',correcta:'D',respuestas:{A:'Cisne',B:'Cierva',C:'Gato',D:'Liebre'}},

3:{img:'loc3.jpg',localizacion:'Nou Pins',pregunta:'¿Cómo se llama el centauro que ayuda a Harry en el Bosque Prohibido?',correcta:'C',respuestas:{A:'Bane',B:'Ronan',C:'Firenze',D:'Magorian'}},

4:{img:'loc4.jpg',localizacion:'Metro Via Júlia',pregunta:'¿Cuál es el nombre de la madre de Sirius Black?',correcta:'C',respuestas:{A:'Bellatrix Black',B:'Druella Black',C:'Walburga Black',D:'Andromeda Black'}},

5:{img:'loc5.jpg',localizacion:'Fuentes Via Júlia',pregunta:'¿Quién le da a Harry las branquialgas para realizar la segunda prueba del Torneo de los Tres Magos?',correcta:'A',respuestas:{A:'Dobby',B:'Neville',C:'Ron',D:'Hermione'}},

6:{img:'loc6.jpg',localizacion:'Ángel Pestaña',pregunta:'¿Cuál es el nombre completo de Albus Dumbledore?',correcta:'B',respuestas:{A:'Albus Percival Walfred Brian Dumbledore',B:'Albus Percival Wulfric Brian Dumbledore',C:'Albus Percival Wilfred Brian Dumbledore',D:'Albus Percival Wulfric Brayan Dumbledore'}}

};

const pista=new URLSearchParams(window.location.search).get('pista')||'1';

const datos=preguntas[pista];

document.getElementById('imagen').innerHTML=
'<img src="'+datos.img+'" class="localizacionimg">';

document.getElementById('localizacion').innerHTML=
'📍 '+datos.localizacion;

document.getElementById('pregunta').innerHTML=
datos.pregunta;

let intentos=0;

for(let letra in datos.respuestas){

let b=document.createElement('button');

b.className='opcion';

b.id=letra;

b.innerHTML='<b>'+letra+')</b> '+datos.respuestas[letra];

b.onclick=()=>comprobar(letra);

document.getElementById('respuestas').appendChild(b);

}

function comprobar(letra){

if(letra===datos.correcta){

document.getElementById(letra).classList.add('correcta');

document.getElementById('resultado').innerHTML=
'✅ ¡Correcto! La magia te guía a la siguiente pista.';

desactivar();

return;
}

intentos++;

document.getElementById(letra).classList.add('incorrecta');

if(intentos>=2){

document.getElementById(datos.correcta).classList.add('correcta');

document.getElementById('resultado').innerHTML=
'❌ Has agotado tus intentos.';

desactivar();

}else{

document.getElementById('resultado').innerHTML=
'❌ Incorrecto. Te queda un intento.';
}

}

function desactivar(){

document.querySelectorAll('.opcion')
.forEach(x=>x.disabled=true);

}

function toggleMusic(){

let m=document.getElementById('music');

if(m.paused){

m.play();

}else{

m.pause();

}

}

</script>

</body>
</html>
